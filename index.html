<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giannis Papamichail</title>
    <meta name="description"
        content="Giannis (Ioannis) Papamichail, Senior Full-Stack Engineer in Athens. Angular, NestJS, Python and AWS; fleet-safety software at Orca AI and founder of Matso.">
    <meta property="og:title" content="Giannis Papamichail · Senior Full-Stack Engineer">
    <meta property="og:description" content="I build software that helps shipping companies keep their fleets safe.">
    <meta name="theme-color" content="#f3f6f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08131c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Apply the saved theme before first paint (shared with the 3D island) -->
    <script>
        try {
            var t = localStorage.getItem('gp-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="#top" aria-label="Back to top">
                <span class="mark" aria-hidden="true">GP</span>
                <span class="brand-name">Giannis Papamichail</span>
            </a>
            <nav class="nav" aria-label="Sections">
                <a href="#experience">Experience</a>
                <a href="#work">Work</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </nav>
            <div class="top-actions">
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
                    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
                    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
                <a class="btn btn-play" href="play/">Play the island</a>
            </div>
        </div>
    </header>

    <main id="main">
        <section class="hero" id="top">
            <canvas class="contours" id="contours" aria-hidden="true"></canvas>
            <div class="wrap hero-inner">
                <p class="eyebrow mono" id="hero-eyebrow"></p>
                <h1 class="display" id="hero-name"></h1>
                <p class="role" id="hero-role"></p>
                <p class="lede" id="hero-tagline"></p>
                <ul class="currently" id="hero-currently" aria-label="Currently"></ul>
                <div class="actions">
                    <a class="btn btn-primary" id="hero-cv" download>Download CV</a>
                    <a class="btn btn-ghost" href="play/">Explore the 3D island →</a>
                </div>
            </div>
        </section>

        <section class="section" id="about">
            <div class="wrap split">
                <h2 class="section-title">About</h2>
                <div class="prose" id="about-body"></div>
            </div>
        </section>

        <section class="section" id="experience">
            <div class="wrap">
                <div class="section-head">
                    <h2 class="section-title">Experience</h2>
                    <p class="section-note mono" id="exp-note"></p>
                </div>
                <ol class="timeline" id="timeline"></ol>
            </div>
        </section>

        <section class="section" id="work">
            <div class="wrap">
                <div class="section-head">
                    <h2 class="section-title">Selected work</h2>
                </div>
                <div class="work-grid" id="work-grid"></div>
            </div>
        </section>

        <section class="section" id="skills">
            <div class="wrap">
                <div class="section-head">
                    <h2 class="section-title">Skills</h2>
                </div>
                <div class="skill-grid" id="skill-grid"></div>
            </div>
        </section>

        <section class="section" id="education">
            <div class="wrap two-col">
                <div>
                    <h2 class="section-title">Education</h2>
                    <div id="education-list"></div>
                </div>
                <div>
                    <h2 class="section-title">Languages</h2>
                    <dl class="langs" id="languages"></dl>
                </div>
            </div>
        </section>

        <section class="section contact" id="contact">
            <div class="wrap">
                <h2 class="contact-title display">Let’s build something.</h2>
                <div class="contact-row">
                    <div class="email-box">
                        <span class="mono label">Email</span>
                        <span class="email" id="contact-email"></span>
                        <button class="copy" id="copy-email" type="button">Copy</button>
                    </div>
                    <div class="links" id="contact-links"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="wrap footer-inner">
            <span id="footer-copy"></span>
            <span class="mono" id="footer-coords"></span>
        </div>
    </footer>

    <noscript>
        <p class="wrap">This page needs JavaScript to show the CV. You can
            <a href="assets/cv/ioannis-papamichail-cv.pdf">download the CV as a PDF</a> instead.</p>
    </noscript>

    <script type="module" src="assets/js/site.js"></script>
</body>

</html>
