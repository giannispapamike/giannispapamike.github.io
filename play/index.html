<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giannis Papamichail — Island</title>
    <link rel="shortcut icon" href="../dist/assets/img/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap">
    <style>
        :root {
            --ink: #1d2433;
            --muted: #5b6477;
            --card: rgba(255, 255, 255, 0.92);
            --accent: #ff7a59;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #9fd3f5;
            font-family: 'Poppins', system-ui, sans-serif;
            color: var(--ink);
        }

        canvas { display: block; touch-action: none; }

        /* HUD */
        .hud {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: none;
        }

        .hud > * { pointer-events: auto; }

        .badge {
            background: var(--card);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
            font-size: 13px;
        }

        .badge strong { font-size: 15px; display: block; }

        .hud-right { display: flex; gap: 8px; }

        .hud a, .hud button {
            color: var(--ink);
            text-decoration: none;
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .stations {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: calc(100% - 32px);
        }

        .stations button {
            font: 600 12px 'Poppins', sans-serif;
            border: 0;
            border-radius: 999px;
            padding: 8px 12px;
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stations button .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            opacity: .35;
        }

        .stations button.visited .dot { opacity: 1; }

        /* Info panel */
        .panel {
            position: fixed;
            top: 50%;
            right: 24px;
            width: min(420px, calc(100% - 32px));
            max-height: calc(100% - 160px);
            overflow: auto;
            transform: translate(120%, -50%);
            transition: transform .45s cubic-bezier(.2, .9, .3, 1.2);
            background: var(--card);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
        }

        .panel.open { transform: translate(0, -50%); }
        .panel:not(.open) { pointer-events: none; }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 26px;
            font-weight: 800;
            border-bottom: 4px solid var(--c, var(--accent));
            display: inline-block;
        }

        .panel .close {
            position: absolute;
            top: 14px;
            right: 16px;
            border: 0;
            background: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--muted);
        }

        .panel p { line-height: 1.6; color: var(--muted); font-size: 14px; }

        .tl-item { border-left: 3px solid var(--c); padding: 2px 0 2px 14px; margin: 14px 0; }
        .tl-item .date { font-size: 12px; font-weight: 600; color: var(--c); }
        .tl-item h3 { margin: 2px 0; font-size: 16px; }
        .tl-item h4 { margin: 0 0 6px; font-weight: 400; color: var(--muted); font-size: 13px; }
        .tl-item ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

        .group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #eef1f6; }
        .tag.got { background: var(--c); color: #fff; }

        .proj { margin: 12px 0; }
        .proj h3 { margin: 0; font-size: 15px; }
        .proj p { margin: 2px 0 0; }
        .proj a, .contact a { color: var(--c); font-weight: 600; }

        .contact a {
            display: block;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 12px;
            background: #eef1f6;
            text-decoration: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translate(-50%, -20px);
            opacity: 0;
            transition: all .3s;
            background: var(--ink);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* Intro */
        .intro {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, rgba(159, 211, 245, .6), rgba(255, 214, 170, .75));
            transition: opacity .6s;
            padding: 16px;
        }

        .intro.hidden { opacity: 0; pointer-events: none; }

        .intro-card { text-align: center; max-width: 520px; }
        .intro-card .hello { letter-spacing: .3em; font-size: 13px; color: var(--muted); }
        .intro-card h1 { font-size: clamp(36px, 9vw, 64px); line-height: 1; margin: 8px 0; font-weight: 800; }
        .intro-card .role { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
        .intro-card .keys { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.8; }

        kbd {
            background: #fff;
            border-radius: 6px;
            padding: 1px 7px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, .15);
            font-family: inherit;
            font-size: 12px;
        }

        .start {
            font: 800 18px 'Poppins', sans-serif;
            border: 0;
            border-radius: 999px;
            padding: 14px 36px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(29, 36, 51, .35);
            transition: transform .15s;
        }

        .start:hover { transform: translateY(-2px) scale(1.03); }

        .intro-card .classic { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 13px; }

        @media (max-width: 640px) {
            .panel {
                top: auto;
                bottom: 110px;
                right: 16px;
                max-height: calc(100% - 200px);
                transform: translateY(calc(100% + 130px));
            }

            .panel.open { transform: translateY(0); }
            .hide-mobile { display: none; }
        }
    </style>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
</head>

<body>
    <div class="hud">
        <div class="badge">
            <strong id="hud-name"></strong>
            <span id="hud-progress">0 stations · 0 skills</span>
        </div>
        <div class="hud-right">
            <a class="badge hide-mobile" id="hud-cv" download>Download CV</a>
            <a class="badge" href="../">Classic view</a>
        </div>
    </div>

    <nav class="stations" id="stations" aria-label="Drive to section"></nav>

    <aside class="panel" id="panel" aria-live="polite">
        <button class="close" id="panel-close" aria-label="Close">×</button>
        <div id="panel-body"></div>
    </aside>

    <div class="toast" id="toast"></div>

    <div class="intro" id="intro">
        <div class="intro-card">
            <div class="hello">HELLO, I AM</div>
            <h1 id="intro-name"></h1>
            <div class="role" id="intro-role"></div>
            <button class="start" id="start">Explore my island →</button>
            <div class="keys">
                Drive with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows · tap or click the ground to
                drive there<br>
                Visit the glowing stations and collect the skill gems
            </div>
            <a class="classic" href="../">Prefer a plain page? Classic view</a>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>

</html>
